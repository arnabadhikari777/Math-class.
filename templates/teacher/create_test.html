{% extends "base.html" %}
{% block title %}Create Test{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <h2>Create a New Test</h2>
  <form method="POST" action="{{ url_for('create_test') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Test Title</label>
    <input type="text" name="title" required placeholder="e.g., Algebra - Model Test 1">

    <label>Subject</label>
    <input type="text" name="subject" placeholder="e.g., Mathematics">

    <label>Class</label>
    <select name="class_name" required>
      <option value="" disabled selected>SELECT YOUR CLASS</option>
      {% for opt in class_options %}
      <option value="{{ opt.value }}">{{ opt.label }}</option>
      {% endfor %}
    </select>

    <label>Duration (minutes)</label>
    <input type="number" name="duration_minutes" value="30" min="1" required>

{% set test = none %}
    <label>Attempts allowed <span class="helper-text">(0 = unlimited)</span></label>
    <input type="number" name="max_attempts" value="{{ (test.max_attempts if test else 1) }}" min="0" max="50">

    <label>Which result counts when there are several attempts</label>
    <select name="result_policy">
      <option value="best" {% if test and test.result_policy == 'best' %}selected{% endif %}>Best attempt</option>
      <option value="latest" {% if test and test.result_policy == 'latest' %}selected{% endif %}>Latest attempt</option>
    </select>

    <label>If time is over before submitting</label>
    <select name="late_policy">
      <option value="auto_submit" {% if not test or test.late_policy == 'auto_submit' %}selected{% endif %}>Auto-submit the last saved answers</option>
      <option value="reject" {% if test and test.late_policy == 'reject' %}selected{% endif %}>Reject the late submission</option>
    </select>

    <label>Grace seconds after the deadline <span class="helper-text">(network delay allowance)</span></label>
    <input type="number" name="grace_seconds" value="{{ (test.grace_seconds if test else 30) }}" min="0" max="600">

    <label>Negative marks per wrong answer <span class="helper-text">(0 = none)</span></label>
    <input type="number" name="negative_marks" value="{{ (test.negative_marks if test else 0) }}" min="0" step="0.25">

    <button class="btn btn-full" type="submit">Create Test & Add Questions</button>
  </form>
</div>
{% endblock %}

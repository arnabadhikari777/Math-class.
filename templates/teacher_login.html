{% extends "base.html" %}
{% block title %}Teacher Login{% endblock %}
{% block content %}
<div class="card" style="max-width:400px; margin:0 auto;">
  <h2>🧑‍🏫 Teacher Login</h2>
  <form method="POST" action="{{ url_for('teacher_login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username</label>
    <input type="text" name="username" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button class="btn btn-full" type="submit">Login</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-badge"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>
      <h1>Welcome back</h1>
      <p>Sign in to continue to your tests, notes and results.</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="lgEmail">Email or Username</label>
      <div class="field">
        <i class="fa-regular fa-user fi" aria-hidden="true"></i>
        <input id="lgEmail" type="text" name="email" required placeholder="you@example.com or username" autocomplete="username">
      </div>

      <label for="lgPass">Password</label>
      <div class="field has-eye">
        <i class="fa-solid fa-lock fi" aria-hidden="true"></i>
        <input id="lgPass" type="password" name="password" required placeholder="Your password" autocomplete="current-password">
        <button type="button" class="eye" data-toggle-pass="lgPass" aria-label="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
      </div>

      <label class="check-row">
        <input type="hidden" name="remember_form" value="1">
        <input type="checkbox" name="remember" value="1" checked> Keep me signed in on this device
      </label>

      <button class="btn btn-primary btn-full mt-2" type="submit" style="width:100%"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Login</button>
    </form>
    <p class="auth-foot"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
    <p class="auth-foot" style="margin-top:.4rem">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Forgot Password - Arnab Math Class{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-badge"><i class="fa-solid fa-key" aria-hidden="true"></i></div>
      <h1>Forgot password?</h1>
      <p>Enter the email you registered with. We will send a 6-digit OTP to that <strong>email</strong> (never to mobile). It is valid for 10 minutes.</p>
    </div>
    <form method="POST" action="{{ url_for('forgot_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="fpEmail">Email address</label>
      <div class="field">
        <i class="fa-regular fa-envelope fi" aria-hidden="true"></i>
        <input id="fpEmail" type="email" name="email" required value="{{ email }}" placeholder="you@example.com" autocomplete="email" inputmode="email">
      </div>
      <button class="btn btn-primary btn-full mt-2" type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send OTP</button>
    </form>
    <p class="auth-foot"><a href="{{ url_for('login') }}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Login</a></p>
  </div>
</div>
{% endblock %}

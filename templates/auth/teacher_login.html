{% extends "base.html" %}
{% block title %}Teacher Login{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:0 auto">
  <h2>Teacher Login</h2>
  <form method="POST" action="{{ url_for('teacher_login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username</label>
    <input type="text" name="username" required autocomplete="username">

    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">

    <label style="display:flex;align-items:center;gap:.5rem;font-weight:500;margin:.6rem 0 0">
      <input type="hidden" name="remember_form" value="1">
      <input type="checkbox" name="remember" value="1" checked style="width:auto;margin:0"> Keep me signed in on this device
    </label>

    <button class="btn btn-primary btn-full mt-2" type="submit" style="width:100%">Login</button>
  </form>
</div>
{% endblock %}

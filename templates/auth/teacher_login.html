{% extends "base.html" %}
{% block title %}Teacher Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-badge"><i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i></div>
      <h1>Teacher login</h1>
      <p>Manage students, tests, notes and notices.</p>
    </div>
    <form method="POST" action="{{ url_for('teacher_login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="tlUser">Username</label>
      <div class="field">
        <i class="fa-regular fa-user fi" aria-hidden="true"></i>
        <input id="tlUser" type="text" name="username" required autocomplete="username" placeholder="Username">
      </div>

      <label for="tlPass">Password</label>
      <div class="field has-eye">
        <i class="fa-solid fa-lock fi" aria-hidden="true"></i>
        <input id="tlPass" type="password" name="password" required autocomplete="current-password" placeholder="Password">
        <button type="button" class="eye" data-toggle-pass="tlPass" aria-label="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
      </div>

      <label class="check-row">
        <input type="hidden" name="remember_form" value="1">
        <input type="checkbox" name="remember" value="1" checked> Keep me signed in on this device
      </label>

      <button class="btn btn-primary btn-full mt-2" type="submit" style="width:100%"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Login</button>
    </form>
  </div>
</div>
{% endblock %}

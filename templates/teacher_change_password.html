{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h2>🔒 Change Teacher Password</h2>
  <p class="text-muted mb-1">Minimum 8 characters, with letters and numbers.</p>
  <form method="POST" action="{{ url_for('teacher_change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current Password</label>
    <input type="password" name="current_password" required autocomplete="current-password">
    <label>New Password</label>
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    <button class="btn btn-full mt-2" type="submit">Update Password</button>
  </form>
  <p class="mt-2 text-center"><a href="{{ url_for('teacher_dashboard') }}">← Back to dashboard</a></p>
</div>
{% endblock %}

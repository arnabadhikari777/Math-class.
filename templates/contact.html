{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h2>📩 Contact Sir</h2>
  <p class="text-muted">Send a message to the teacher. The teacher’s mobile number is never shown on this site.</p>
  <form method="POST">
    <label>Your Name *</label>
    <input type="text" name="name" required value="{{ session.get('student_name','') }}">
    <label>Email</label>
    <input type="email" name="email">
    <label>Your Mobile</label>
    <input type="text" name="mobile" placeholder="Optional — so Sir can call back">
    <label>Subject</label>
    <input type="text" name="subject" placeholder="e.g. Doubt about chapter 5">
    <label>Message *</label>
    <textarea name="message" required rows="5"></textarea>
    <button type="submit" class="btn btn-primary mt-2">Send Message</button>
  </form>
</div>
{% endblock %}

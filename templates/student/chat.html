{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}?v=2">{% endblock %}
{% block content %}
<div id="chatApp" class="chat-app" data-conv="{{ conv_id or '' }}" data-tab="{{ tab }}" data-readonly="{{ 1 if readonly else 0 }}">
  <section class="chat-side" id="chatSide">
    <header class="side-head">
      <h1>Messages</h1>
      <a class="icon-btn side-set" href="{{ url_for('student_settings') }}" aria-label="Chat privacy settings" title="Chat privacy settings"><i class="fa-solid fa-sliders" aria-hidden="true"></i></a>
    </header>
    <div class="chat-tabs" role="tablist" aria-label="Chat sections">
      <button type="button" role="tab" data-tab="chats" class="on" aria-selected="true"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i><span>Chats</span><span class="cbadge" id="tabBadgeChats" hidden></span></button>
      <button type="button" role="tab" data-tab="people" aria-selected="false"><i class="fa-solid fa-user-group" aria-hidden="true"></i><span>People</span></button>
      <button type="button" role="tab" data-tab="requests" aria-selected="false"><i class="fa-solid fa-user-clock" aria-hidden="true"></i><span>Requests</span><span class="cbadge" id="tabBadgeReq" hidden></span></button>
    </div>
    <div class="chat-search" id="chatSearch" hidden>
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="chatSearchInput" placeholder="Search students by name" autocomplete="off" maxlength="40" aria-label="Search students">
    </div>
    <div class="chat-list" id="chatList" aria-live="polite"></div>
    <div class="chat-more" id="chatMore" hidden><button type="button" class="btn btn-outline btn-sm" id="chatMoreBtn">Load more</button></div>
  </section>

  <section class="chat-room" id="chatRoom" hidden>
    <header class="room-head">
      <button type="button" class="room-back" id="roomBack" aria-label="Back to chats"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <div class="avatar" id="roomAvatar" aria-hidden="true"></div>
      <div class="room-who"><strong id="roomName"></strong><span id="roomStatus" class="room-status"></span></div>
    </header>
    <div class="room-wrap">
      <div class="room-msgs" id="roomMsgs" aria-live="polite">
        <div class="room-older" id="roomOlder" hidden><button type="button" class="btn btn-outline btn-sm" id="roomOlderBtn">Older messages</button></div>
        <div id="roomItems"></div>
        <div class="msg theirs typing-bubble" id="roomTyping" hidden aria-label="typing"><span></span><span></span><span></span></div>
      </div>
      <button type="button" class="room-jump" id="roomJump" aria-label="Jump to latest message" hidden><i class="fa-solid fa-chevron-down" aria-hidden="true"></i><span class="cbadge" id="roomJumpCount" hidden></span></button>
    </div>
    <form class="room-input" id="roomForm" autocomplete="off">
      <div class="composer">
        <textarea id="roomText" rows="1" maxlength="2000" placeholder="Write a message" aria-label="Message" enterkeyhint="send"></textarea>
        <button type="submit" class="send-btn" id="roomSend" aria-label="Send" disabled><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
      </div>
    </form>
  </section>

  <section class="chat-empty" id="chatEmpty"><div class="empty-ic"><i class="fa-regular fa-comments" aria-hidden="true"></i></div><h2>Your messages</h2><p>Select a chat, or find a classmate in People to start talking.</p></section>
</div>
{% endblock %}

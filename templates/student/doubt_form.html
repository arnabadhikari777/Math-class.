{% extends "base.html" %}
{% block title %}Ask a Doubt{% endblock %}
{% block content %}
<div class="page-head"><h1>Ask a Doubt</h1><p>Write your question clearly. Sir will answer it, and you can also ask the AI.</p></div>
<form method="POST" action="{{ url_for('doubt_new') }}" enctype="multipart/form-data" class="card dbt-form" id="doubtForm" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="token" value="{{ token }}">
  <label for="dSubject">Subject <span class="req">*</span></label>
  <input id="dSubject" name="subject" list="dSubjects" required maxlength="60" value="{{ f.get('subject', '') }}" placeholder="e.g. Maths" autocomplete="off">
  <datalist id="dSubjects">{% for s in subjects %}<option value="{{ s }}">{% endfor %}</datalist>
  <div class="dbt-two">
    <div><label for="dChapter">Chapter <span class="text-muted">(optional)</span></label>
      <input id="dChapter" name="chapter" maxlength="120" value="{{ f.get('chapter', '') }}" placeholder="e.g. Quadratic Equations"></div>
    <div><label for="dTopic">Topic <span class="text-muted">(optional)</span></label>
      <input id="dTopic" name="topic" maxlength="120" value="{{ f.get('topic', '') }}" placeholder="e.g. Discriminant"></div>
  </div>
  <label for="dQuestion">Your question <span class="req">*</span></label>
  <textarea id="dQuestion" name="question" rows="6" required maxlength="4000" placeholder="Write your doubt in detail…">{{ f.get('question', '') }}</textarea>
  <label for="dImage">Question picture <span class="text-muted">(optional)</span></label>
  <input id="dImage" type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
  <p class="text-muted dbt-hint">JPG, PNG, WEBP or GIF, up to 5 MB.</p>
  <img id="dPreview" class="dbt-preview" alt="Selected picture preview" hidden>
  <button type="submit" class="btn btn-primary" id="dSubmit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send to Sir</button>
  <p class="text-muted dbt-hint" id="dBusy" hidden>Sending… please do not close this page.</p>
</form>
{% endblock %}

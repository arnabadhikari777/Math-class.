{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>Student Login</h2>
  <form method="POST" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email Address</label>
    <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">

    <label>Password</label>
    <input type="password" name="password" required placeholder="Password" autocomplete="current-password">

    <button class="btn btn-primary btn-full mt-2" type="submit" style="width:100%">Login</button>
  </form>
  <p class="helper-text text-center mt-2">
    <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
  </p>
  <p class="helper-text text-center mt-1">
    Don't have an account? <a href="{{ url_for('register') }}">Register</a>
  </p>
</div>
{% endblock %}
